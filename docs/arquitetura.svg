<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da aplicação Vitrine</title>
  <desc id="desc">A interface Vitrine se comunica com a API própria em FastAPI, que persiste dados no SQLite e consulta a Fake Store API.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10213f" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52617a"/></marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff806d"/><stop offset="1" stop-color="#ff5742"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="30" fill="#f8f7f3"/>
  <text x="70" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10213f">Arquitetura do MVP Vitrine</text>
  <text x="70" y="102" font-family="Arial,sans-serif" font-size="16" fill="#647089">Três módulos independentes comunicando-se por REST</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="265" height="205" rx="22" fill="#fff" stroke="#e5e8ee"/>
    <rect x="70" y="180" width="265" height="54" rx="22" fill="url(#hero)"/>
    <rect x="70" y="211" width="265" height="23" fill="url(#hero)"/>
    <text x="202" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Interface Vitrine</text>
    <text x="98" y="270" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• Loja e catálogo</text>
    <text x="98" y="300" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• Carrinho e orçamento</text>
    <text x="98" y="330" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• Painel administrativo</text>
    <text x="98" y="360" font-family="Arial,sans-serif" font-size="13" fill="#647089">HTML • CSS • JavaScript • Docker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="180" width="265" height="205" rx="22" fill="#fff" stroke="#e5e8ee"/>
    <rect x="470" y="180" width="265" height="54" rx="22" fill="#10213f"/>
    <rect x="470" y="211" width="265" height="23" fill="#10213f"/>
    <text x="602" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">API Vitrine</text>
    <text x="498" y="270" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• CRUD de produtos</text>
    <text x="498" y="300" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• Métricas administrativas</text>
    <text x="498" y="330" font-family="Arial,sans-serif" font-size="15" fill="#10213f">• Integração externa</text>
    <text x="498" y="360" font-family="Arial,sans-serif" font-size="13" fill="#647089">FastAPI • Swagger • Docker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="865" y="150" width="265" height="145" rx="22" fill="#fff" stroke="#e5e8ee"/>
    <text x="997" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10213f">Fake Store API</text>
    <text x="893" y="237" font-family="Arial,sans-serif" font-size="15" fill="#10213f">Catálogo público externo</text>
    <text x="893" y="265" font-family="Arial,sans-serif" font-size="13" fill="#647089">GET /products • JSON</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="997" cy="387" rx="132" ry="38" fill="#fff" stroke="#e5e8ee"/>
    <rect x="865" y="350" width="264" height="82" fill="#fff" stroke="#e5e8ee"/>
    <ellipse cx="997" cy="432" rx="132" ry="38" fill="#eef1f5" stroke="#e5e8ee"/>
    <text x="997" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10213f">SQLite</text>
    <text x="997" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#647089">persistência local</text>
  </g>

  <line x1="350" y1="282" x2="453" y2="282" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="455" y1="306" x2="352" y2="306" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="402" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#647089">REST / JSON</text>
  <line x1="751" y1="245" x2="850" y2="225" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="850" y1="250" x2="751" y2="270" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#647089">HTTPS</text>
  <line x1="751" y1="330" x2="849" y2="383" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="849" y1="411" x2="751" y2="355" stroke="#52617a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="794" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#647089">SQL</text>

  <text x="70" y="505" font-family="Arial,sans-serif" font-size="14" fill="#647089">GET • POST • PATCH • DELETE</text>
  <text x="1130" y="505" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#647089">Componentes executados em contêineres independentes</text>
</svg>
